[package]
name = "rusty_ytdl"
version = "0.8.1"
authors = ["Mithronn"]
edition = "2021"
description = "A Rust library for Youtube video searcher and downloader"
repository = "https://github.com/Mithronn/rusty-ytdl"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["youtube", "downloader", "ytdl", "youtube-dl", "searcher"]
include = ["src/**/*", "Cargo.toml"]
exclude = ["examples/**/*", "tests/**/*", ".github/**/*"]
categories = ["multimedia::video", "multimedia::audio"]
rust-version = "1.96.0"

[package.metadata.docs.rs]
all-features = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "cookies",
    "gzip",
] }
scraper = "0.25.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_qs = "0.15.0"
regex = "1"
url = "2"
urlencoding = "2.1.3"
thiserror = "2"
derive_more = { version = "2.1.1", features = ["display"] }
derivative = "2.2.0"
once_cell = "1.19.0"
tokio = { version = "1", features = ["full"] }
rand = "0.9"
reqwest-middleware = { version = "0.5.0", features = ["json", "query"] }
reqwest-retry = "0.9.0"
m3u8-rs = "6.0.0"
async-trait = "0.1"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["std"] }
hex = "0.4.3"
rquickjs = { version = "0.6" }
mime = "0.3"
bytes = "1.7.1"
flame = { version = "0.2.2", optional = true }
flamer = { version = "0.5.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
default = ["search", "live", "default-tls"]
performance_analysis = ["flame", "flamer"]
live = ["tokio/time", "tokio/process"]
blocking = ["tokio/rt", "tokio/rt-multi-thread"]
search = []
ffmpeg = ["tokio/process", "tokio/io-util"]
default-tls = ["reqwest/default-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
socks = ["reqwest/socks"]
# Explicit opt-in for tests that depend on the live YouTube service or a local ffmpeg binary.
# Default CI intentionally excludes these nondeterministic provider smoke tests.
live-tests = []

[[test]]
name = "download_with_chunks"
path = "tests/download_with_chunks.rs"
required-features = ["live-tests"]

[[test]]
name = "download_with_blocking_chunks"
path = "tests/download_with_blocking_chunks.rs"
required-features = ["live-tests", "blocking"]

[[test]]
name = "get_info"
path = "tests/get_info.rs"
required-features = ["live-tests"]

[[test]]
name = "get_info_blocking"
path = "tests/get_info_blocking.rs"
required-features = ["live-tests", "blocking"]

[[test]]
name = "get_info_with_options"
path = "tests/get_info_with_options.rs"
required-features = ["live-tests"]

[[test]]
name = "search"
path = "tests/search.rs"
required-features = ["live-tests", "search"]

[[test]]
name = "search_playlist"
path = "tests/search_playlist.rs"
required-features = ["live-tests", "search"]

[[test]]
name = "suggestion"
path = "tests/suggestion.rs"
required-features = ["live-tests", "search"]

[[test]]
name = "ffmpeg_download_test"
path = "tests/ffmpeg_download_test.rs"
required-features = ["live-tests", "ffmpeg"]

[[test]]
name = "ffmpeg_test"
path = "tests/ffmpeg_test.rs"
required-features = ["live-tests", "ffmpeg"]

[[example]]
name = "multiple_downloads"
path = "examples/multiple_downloads.rs"
required-features = ["performance_analysis"]

[[example]]
name = "blocking"
path = "examples/blocking.rs"
required-features = ["blocking"]

[[example]]
name = "download_with_ffmpeg"
path = "examples/download_with_ffmpeg.rs"
required-features = ["ffmpeg"]

[[example]]
name = "search"
path = "examples/search.rs"
required-features = ["search"]

[[example]]
name = "suggestion"
path = "examples/suggestion.rs"
required-features = ["search"]
